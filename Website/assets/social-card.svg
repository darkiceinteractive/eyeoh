    </g>
  </g>
  <text x="212" y="136" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f8fafc">EyeOh</text>
  <text x="212" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#8fb0bf">by Dark Ice</text>

  <text font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#f8fafc">
