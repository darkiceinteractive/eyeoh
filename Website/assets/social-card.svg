<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1b24"/>
      <stop offset="1" stop-color="#061219"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#008bb4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#008bb4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shot-clip"><rect x="800" y="58" width="300" height="501" rx="22"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="950" cy="310" r="330" fill="url(#glow)"/>

  <g transform="translate(80 78)">
    <rect x="3" y="3" width="108" height="108" rx="25" fill="#0a1218" stroke="#1d3441" stroke-width="2"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.69)">
      <path d="M23 82h35M45 68l14 14-14 14" stroke="#a0ce4e" stroke-width="11"/>
      <path d="M70 75v14M82 59v46M94 69v26" stroke="#f8fafc" stroke-width="10"/>
