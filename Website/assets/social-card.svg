  <text x="80" y="590" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#008bb4">Free for macOS 14 or later  |  eyeoh.app</text>

  <rect x="796" y="54" width="308" height="509" rx="25" fill="#000" fill-opacity="0.35"/>
  <image x="800" y="58" width="300" height="501" xlink:href="data:image/png;base64,@@MENU_PNG@@" clip-path="url(#shot-clip)" preserveAspectRatio="xMidYMid slice"/>
  <rect x="800" y="58" width="300" height="501" rx="22" fill="none" stroke="#2a4a5a" stroke-width="2"/>
